<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trắc nghiệm DSS & Hệ gợi ý</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#667085;--line:#dde1e8;--accent:#2f5bea;--ok:#1a7f4b;--okbg:#e6f6ec;--bad:#c0392b;--badbg:#fdecea}
  @media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--text:#e6e8ec;--muted:#98a0ad;--line:#2d333d;--accent:#7d9bff;--ok:#5dd28f;--okbg:#17301f;--bad:#ff8577;--badbg:#3a1b18}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,"Segoe UI",sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
  .bar{max-width:820px;margin:auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
  h1{font-size:18px;margin:0}
  .stats{color:var(--muted);font-size:14px}
  .stats b{color:var(--text)}
  .progress{height:4px;background:var(--line);margin-top:8px}
  .progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  main{max-width:820px;margin:16px auto;padding:0 16px 80px}
  .tools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:14px;font-size:14px}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 12px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .q h2{font-size:16px;margin:0 0 10px;font-weight:600}
  .q h2 span{color:var(--accent);margin-right:6px}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:6px 0;padding:8px 12px;border-radius:8px}
  .opt .k{font-weight:700;min-width:1.4em}
  .q.done .opt{cursor:default}
  .opt.ok{background:var(--okbg);border-color:var(--ok)}
  .opt.bad{background:var(--badbg);border-color:var(--bad)}
  .final{display:none;background:var(--card);border:1px solid var(--accent);border-radius:10px;padding:16px;margin-bottom:14px;text-align:center}
  .final .big{font-size:28px;font-weight:700}
  .hide-done .q.done{display:none}
  .note{color:var(--muted);font-size:13px;margin-top:20px}
  .search{max-width:820px;margin:10px auto 0;display:flex;gap:8px}
  .search input{flex:1;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
  .search input:focus{outline:2px solid var(--accent);border-color:transparent}
  .count{color:var(--muted);font-size:14px;margin-bottom:10px}
  .q.res .opt{cursor:default}
  .q.res .opt:not(.ok){opacity:.75}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Trắc nghiệm DSS &amp; Hệ gợi ý (50 câu)</h1>
    <div class="stats">Đã làm <b id="sAns">0</b>/50 · Đúng <b id="sOk">0</b> · Sai <b id="sBad">0</b></div>
  </div>
  <div class="search">
    <input id="search" type="search" placeholder="Tìm câu hỏi / đáp án (gõ từ khoá, không cần dấu)..." autocomplete="off">
    <button id="clearSearch" type="button">Xoá</button>
  </div>
  <div class="progress"><i id="bar"></i></div>
</header>
<main>
  <div class="tools">
    <label><input type="checkbox" id="shuf" checked> Xáo trộn đáp án</label>
    <label><input type="checkbox" id="shufQ"> Xáo trộn thứ tự câu</label>
    <button id="reset" class="primary">Làm lại</button>
    <button id="wrongOnly">Chỉ xem câu sai</button>
  </div>
  <div class="final" id="final"><div class="big" id="finalScore"></div><div id="finalMsg"></div></div>
  <div id="list"></div>
  <p class="note">Đáp án do mình suy luận từ kiến thức môn học, chưa phải đáp án chính thức của giảng viên — hãy đối chiếu lại với bài giảng nếu cần.</p>
</main>

["DSS được ứng dụng trong lĩnh vực kinh doanh để làm gì?",["Hỗ trợ dự đoán xu hướng tiêu dùng, quản lý chuỗi cung ứng và lập kế hoạch tài chính","Chỉ để bán hàng trực tuyến","Chỉ để quản lý nhân sự","Chỉ để tính lương"]],
["Hạn chế chính của kỹ thuật lọc dựa trên nội dung là gì?",["Over-specialization và thiếu tính khám phá","Không thể xử lý sản phẩm mới","Cần rất nhiều dữ liệu cộng đồng","Không thể giải thích lý do gợi ý"]],
["Trong hệ thống gợi ý việc làm, nếu ta sử dụng Content-based filtering, ta cần xây dựng vector đặc trưng cho đối tượng nào?",["Cả người tìm việc và tin tuyển dụng","Chỉ người tìm việc","Chỉ tin tuyển dụng","Chỉ công ty"]],
["Vấn đề có cấu trúc có thể dễ dàng làm gì?",["Thuật toán hóa và lập trình","Không thể lập trình được","Chỉ giải quyết bằng trực giác","Chỉ giải quyết bằng kinh nghiệm"]],
["Trong hệ thống gợi ý việc làm, nếu ta sử dụng Hybrid recommender system, lợi ích chính là gì?",["Kết hợp hồ sơ ứng viên (CBF) và hành vi cộng đồng (CF) để gợi ý tốt hơn","Chỉ sử dụng một nguồn dữ liệu duy nhất","Loại bỏ hoàn toàn vấn đề cold-start","Không cần dữ liệu đánh giá"]],
];

const $ = id => document.getElementById(id);
const L = "abcd";
let items = [], onlyWrong = false;

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function build(){
  const doShuf = $("shuf").checked;
  let order = Q.map((_,i)=>i);
  if($("shufQ").checked) shuffle(order);
  items = order.map((qi,pos)=>{
    const [text, opts] = Q[qi];
    let idx = opts.map((_,i)=>i);
    if(doShuf) shuffle(idx);
    return {num: qi+1, text, opts: idx.map(i=>opts[i]), correct: idx.indexOf(0), picked: null};
  });
  onlyWrong = false; $("wrongOnly").textContent = "Chỉ xem câu sai";
  render();
}

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"d").toLowerCase();
const NQ = Q.map(([t,o]) => norm(t+" "+o.join(" ")));

function renderSearch(tokens){
  const list = $("list"); list.innerHTML = "";
  const hits = [];
  Q.forEach((q,i)=>{ if(tokens.every(t=>NQ[i].includes(t))) hits.push(i); });
  const c = document.createElement("div"); c.className = "count";
  c.textContent = hits.length ? `Tìm thấy ${hits.length} câu` : "Không tìm thấy câu nào";
  list.appendChild(c);
  hits.forEach(i=>{
    const [text,opts] = Q[i];
    const q = document.createElement("div"); q.className = "q res";
    q.innerHTML = `<h2><span>Câu ${i+1}.</span>${text}</h2>`;
    opts.forEach((o,k)=>{
      const b = document.createElement("div"); b.className = "opt" + (k===0?" ok":"");
      b.innerHTML = `<span class="k">${L[k]}.</span><span>${o}${k===0?" ✓":""}</span>`;
      q.appendChild(b);
    });
    list.appendChild(q);
  });
}

function render(){
  const tokens = norm($("search").value).split(/\s+/).filter(Boolean);
  if(tokens.length){ renderSearch(tokens); stats(); return; }
  const list = $("list"); list.innerHTML = "";
  items.forEach((it,n)=>{
    if(onlyWrong && !(it.picked!==null && it.picked!==it.correct)) return;
    const q = document.createElement("div"); q.className = "q" + (it.picked!==null?" done":"");
    q.innerHTML = `<h2><span>Câu ${it.num}.</span>${it.text}</h2>`;
    it.opts.forEach((o,i)=>{
      const b = document.createElement("button"); b.className = "opt";
      if(it.picked!==null){
        if(i===it.correct) b.classList.add("ok");
        else if(i===it.picked) b.classList.add("bad");
      }
      b.innerHTML = `<span class="k">${L[i]}.</span><span>${o}</span>`;
      b.onclick = ()=>{ if(it.picked===null){ it.picked=i; render(); } };
      q.appendChild(b);
    });
    list.appendChild(q);
  });
  stats();
}

function stats(){
  const ans = items.filter(i=>i.picked!==null).length;
  const ok = items.filter(i=>i.picked===i.correct).length;
  $("sAns").textContent = ans; $("sOk").textContent = ok; $("sBad").textContent = ans-ok;
  $("bar").style.width = (ans/items.length*100)+"%";
  const f = $("final");
  if(ans===items.length){
    f.style.display = "block";
    $("finalScore").textContent = `${ok}/${items.length} câu đúng (${(ok/items.length*10).toFixed(1)}/10)`;
    $("finalMsg").textContent = ok===items.length ? "Tuyệt đối!" : "Bấm “Chỉ xem câu sai” để ôn lại các câu làm sai.";
  } else f.style.display = "none";
}

$("search").oninput = render;
$("clearSearch").onclick = ()=>{ $("search").value = ""; render(); };
$("reset").onclick = build;
$("shuf").onchange = build;
$("shufQ").onchange = build;
$("wrongOnly").onclick = ()=>{
  onlyWrong = !onlyWrong;
  $("wrongOnly").textContent = onlyWrong ? "Xem tất cả" : "Chỉ xem câu sai";
  render();
};
build();
</script>
</body>
</html>
